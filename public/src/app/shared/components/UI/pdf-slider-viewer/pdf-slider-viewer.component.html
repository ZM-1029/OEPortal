<div style="position: fixed; inset: 0; background: #fff; z-index: 1000;">
    <button
      (click)="closeDialog()"
      style="position: absolute; top: 10px; right: 20px; font-size: 20px; z-index: 10;"
    >
      ✖
    </button>
  
    <div *ngIf="loading" class="text-center mt-5">Loading PDF...</div>
  
    <owl-carousel-o
      *ngIf="!loading && pageImages.length"
      [options]="customOptions"
      style="padding-top: 40px;"
    >
      <ng-container *ngFor="let img of pageImages">
        <ng-template carouselSlide>
          <img [src]="img" style="width: 100%; max-height: 90vh; object-fit: contain;" />
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>
