<div class="main-content m-4">
  <!-- Close Icon -->
  <!-- <mat-icon class="close-icon" style="float:right" (click)="closePopup()">close</mat-icon> -->

  <div class="border-bottom bg-light pb-2">
    <h2 class="formHeading">{{ formHeading }} Taxes</h2>
  </div>

  <div class="form-container d-flex justify-content-center">
    <form [formGroup]="countryForm">
      <div class="d-flex justify-content-end"> 
        <button class="btn btn-light shadow-sm " (click)="addTax()">
          <mat-icon>add</mat-icon></button>
      </div>
      <div class="input-form-container py-3">
        <div class="form-group row">
          <!-- <div style="display: flex; align-items: center; width: 80%;"> <button class="btn " (click)="addTax()">+
            Add More Tax</button></div> -->
          <mat-label class="outer-mat-label col-2 pt-4">Taxes</mat-label>
          <div class="col-10 ">
            <div class="w100" formArrayName="Taxes">
              <div class="d-flex my-3" *ngFor="let tax of taxes.controls; let i = index" [formGroupName]="i">
                <mat-form-field appearance="outline" class="me-2">
                  <input formControlName="TaxName" matInput placeholder="Tax Name (e.g., VAT)" />
                  <mat-error *ngIf="tax.get('TaxName')?.hasError('required') && tax.get('TaxName')?.touched">Tax Name is
                    required</mat-error>
                  <mat-error *ngIf="tax.get('TaxName')?.hasError('pattern') && tax.get('TaxName')?.touched">Letters and spaces only</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline">
                  <input formControlName="TaxRate" matInput type="number" placeholder="Rate (%)" />
                  <mat-error *ngIf="tax.get('TaxRate')?.hasError('required') && tax.get('TaxRate')?.touched">Tax Rate is
                    required</mat-error>
                  <mat-error *ngIf="tax.get('TaxRate')?.hasError('min') && tax.get('TaxRate')?.touched">Tax Rate must be
                    at least 0%</mat-error>
                  <mat-error *ngIf="tax.get('TaxRate')?.hasError('max') && tax.get('TaxRate')?.touched">Tax Rate cannot
                    exceed 100%</mat-error>
                </mat-form-field>
                <button (click)="removeTax(i)" class="btn delete-btn text-danger d-flex justify-content-center align-items-start ms-2">
                  <mat-icon  svgIcon="delete"></mat-icon>
                </button>
                
              </div>
            </div>
          </div>
        </div>
      </div>
    
      <div class="col-4" style="display: flex; align-items: center; justify-content: end; "[style.display]="this.Id > 0 ? 'flex' : 'none'">
        <mat-label class="outer-mat-label p-2">Is Active</mat-label>
        <mat-slide-toggle color="primary" formControlName="IsActive"></mat-slide-toggle>
      </div>

      <!-- Form Buttons -->
      <div class="form-btn d-flex align-items-start justify-content-end p-4">
        <button class="btn btn-secondary mx-2" type="button" (click)="resetForm()">Clear</button>
        <button class="btn btn-info-dark text-white" type="submit" (click)="createUpdate()">{{ formHeading }}</button>
      </div>
    </form>
  </div>
</div>
