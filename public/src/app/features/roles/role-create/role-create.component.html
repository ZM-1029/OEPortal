<div mat-dialog-content class="dialog-content">
  <div class="dialog-header">
    <h2>Create New Role</h2>
    <mat-icon class="text-danger float-end pb-2" (click)="cancel()" svgIcon="cross"></mat-icon>
  </div>

  <form [formGroup]="roleForm">
    <div class="pt-3 pb-2 px-3">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Role Name</mat-label>
        <input matInput placeholder="Enter Role Name" formControlName="roleName" />
        
        <mat-error *ngIf="roleForm.get('roleName')?.hasError('required') && isSubmitted">
          Role name is required.
        </mat-error>
        <mat-error *ngIf="roleForm.get('roleName')?.hasError('minlength')">
          Minimum 3 characters required.
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <div mat-dialog-actions align="end" class="dialog-actions px-3 py-2">
    <button type="button" mat-dialog-close (click)="cancel()" class="btn btn-light border rounded-pill">
      Cancel
    </button>
    <button  type="submit" (click)="createRole()" class="btn btn-info-dark rounded-pill" [disabled]="!roleForm.get('roleName')?.value?.trim()" >
      Save
    </button>
  </div>
</div>
