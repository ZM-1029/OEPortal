<div style="position: fixed; inset: 0; background: #fff; z-index: 1000;" (keydown)="onKeyDown($event)" tabindex="0">

  <!-- Loader while PDF is loading -->
  <div *ngIf="loading" class="d-flex justify-content-center align-items-center h-100">
    <app-loader></app-loader>
  </div>

  <!-- PDF Viewer: One page at a time -->
  <pdf-viewer
    *ngIf="!loading"
    [src]="pdfSrc"
    [render-text]="true"
    [original-size]="false"
    [fit-to-page]="true"
    [autoresize]="true"
    [show-borders]="false"
    [zoom]="1"
    [show-all]="false"
    [page]="page"
    (after-load-complete)="onPdfLoad($event)"
    style="width: 100%; height: 100vh;">
  </pdf-viewer>
</div>
