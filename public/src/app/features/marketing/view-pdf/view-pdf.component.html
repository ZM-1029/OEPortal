
   <div style="position: fixed; inset: 0; background: #fff; z-index: 1000;">
    <button
      (click)="closeDialog()"
      style="position: absolute; top: 10px; right: 20px; font-size: 20px; z-index: 10;"
    >
      ✖
    </button>
  
    <!-- Loading Indicator -->
    <div *ngIf="loading" class="d-flex justify-content-center align-items-center h-100">
      <div class="text-center">
        <!-- <mat-spinner></mat-spinner> -->
        <app-loader></app-loader>
      </div>
    </div>
  
    <!-- PDF Viewer UI -->
    <div class="p-2" style="height: 100vh;" *ngIf="!loading">
      <div class="d-flex flex-column h-100 position-relative">
  
        <!-- Top Controls -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <div class="d-flex align-items-center">
            <mat-icon svgIcon="zoomOut" class="mx-2 cursor-pointer" (click)="zoomOut()"></mat-icon>
            <mat-icon svgIcon="zoomIn" class="mx-2 cursor-pointer" (click)="zoomIn()"></mat-icon>
            <span class="ms-3">Zoom: {{ (zoom * 100) | number:'1.0-0' }}%</span>
          </div>
          
        </div>
  
        <!-- PDF + Vertical Slider -->
        <div class="d-flex flex-grow-1 overflow-hidden">
          
          <!-- Vertical Slider -->
          <div class="d-flex flex-column align-items-center me-3 px-2" style="width: 40px;">
            <input
              type="range"
              orient="vertical"
              min="1"
              [max]="totalPages"
              [(ngModel)]="page"
              class="form-range"
              style="writing-mode: bt-lr; transform: rotate(180deg); height: 100%;"
            />
            <div class="small text-center mt-1">{{ page }} / {{ totalPages }}</div>
          </div>
  
          <!-- PDF Viewer -->
          <div class="flex-grow-1 position-relative overflow-hidden">
            <pdf-viewer
              [src]="pdfSrc"
              [page]="page"
              [render-text]="true"
              [original-size]="false"
              [fit-to-page]="true"
              [autoresize]="true"
              [show-borders]="false"
              [zoom]="zoom"
              [show-all]="false"
              style="width: 100%; height: 100%;"
              (after-load-complete)="onPdfLoad($event)">
            </pdf-viewer>
  
            <!-- Watermark on Page 1 -->
         
  
        </div>
      </div>
    </div>
  </div>
