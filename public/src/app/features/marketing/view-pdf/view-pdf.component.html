<div style="position: fixed; inset: 0; background: #fff; z-index: 1000;">

  <!-- Close Button -->
  <button class=" text-danger close-btn"
    (click)="closeDialog()"
    style="position: absolute; top: 10px; right: 20px; font-size: 20px; background: transparent; border: none; cursor: pointer; z-index: 10;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M18 6L6 18M6 6l12 12" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <!-- Loader while PDF is loading -->
  <div *ngIf="loading" class="d-flex justify-content-center align-items-center h-100">
    <app-loader></app-loader>
  </div>

  <!-- PDF Viewer Fullscreen -->
  <pdf-viewer
    *ngIf="!loading"
    [src]="pdfSrc"
    [render-text]="true"
    [original-size]="false"
    [fit-to-page]="true"
    [autoresize]="true"
    [show-borders]="false"
    [zoom]="1"
    [show-all]="true"
    style="width: 100%; height: 100vh;">
  </pdf-viewer>
</div>
