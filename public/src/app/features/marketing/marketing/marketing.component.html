<div class="marketing">
  <div class="pdf-container">
    <div class=" top-bar">
      <h1 class="page-title fw-medium fs-18 mb-0 text-capitalize">Marketing</h1>
      <div class="d-flex justify-content-between">
        <button class="btn btn-info-dark btn-wave mx-2 text-white text-capitalize" (click)="addPdf()">
          <i class="fa-solid fa-plus me-2"></i>Create New
        </button>
      </div>
    </div>
    <div class="preview-screen">
      <div class="card-wrapper">
        <div
          class="ppt_card mx-2 my-2"
          *ngFor="let card of marketingList; let i = index"
        >
          <img
            class="ppt_feature"
            [src]="card.logoUrl || 'https://via.placeholder.com/250x180.png?text=No+Image'"
            alt="Card image"
          />
          <div class="detailed">
            <div
              class="d-flex justify-content-center align-items-center mx-auto"
              style="
                background-color: #2e3b64;
                height: 36px;
                width: 36px;
                border-radius: 50%;
                color: white;
                font-size: 14px;
                margin-top: -15px;
              "
            >
              {{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}
            </div>
            <h3
              class="mt-3"
              style="
                color: rgba(0, 0, 0, 0.92);
                text-align: center;
                font-size: 14px;
                font-weight: 500;
              "
            >
              {{ card.heading }}
            </h3>
            <p
              style="
                color: rgba(0, 0, 0, 0.72);
                text-align: center;
                font-size: 12px;
                font-weight: 400;
              "
            >
              {{
                card.description.length > 60
                  ? (card.description | slice: 0:60) + '...'
                  : card.description
              }}
            </p>
            <div class="d-flex justify-content-center gap-3 mt-2 interactions">
              <span class="text-primary" (click)="editCard(card)">
                <mat-icon svgIcon="edit"></mat-icon>
              </span>
              <!-- (click)="viewPdf(card.pdf)" -->
              <button
              (click)="viewPdf(card.id)"
                class=""
                style="
                  background-color: #0d6efd;
                  color: white;
                  width: 90px;
                  height: 32px;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  border: none;
                  border-radius: 20px;
                "
              >
                View PPT
              </button>
              <button (click)="DeleteModal(card.id)" class="btn text-danger">
                <mat-icon svgIcon="delete"></mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
