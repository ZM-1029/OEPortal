<div class="marketing">
  <div class="pdf-container">
    <div class=" top-bar">
      <h1 class="page-title fw-medium fs-18 mb-0 text-capitalize">Marketing</h1>
      <div class="d-flex justify-content-between">
        <button [ngClass]="marketingAccess.add?'':'d-none'"
          class="btn btn-info-dark btn-wave mx-2 text-white text-capitalize" (click)="addPdf()">
          <i class="fa-solid fa-plus me-2"></i>Create New
        </button>
      </div>
    </div>
    <div class="preview-screen">
      <div class="card-wrapper">
        @if(marketingAccess.view){
        <div class="ppt_card mx-2 my-2" *ngFor="let card of allMarketing; let i = index">
          <img class="ppt_feature" [src]="card.logoUrl || 'https://via.placeholder.com/250x180.png?text=No+Image'"
            alt="Card image" />
          <div class="detailed">
            <div class="d-flex justify-content-center align-items-center mx-auto card-detailed-content">
              {{ i + 1 < 10 ? '0' + (i + 1) : i + 1 }}</div>
                <h3 class="mt-3 card-heading">
                  {{ card.heading }}
                </h3>
                <p class="card-description">
                  {{
                  card.description.length > 60
                  ? (card.description | slice: 0:60) + '...'
                  : card.description
                  }}
                </p>
                <div class="d-flex justify-content-center gap-3 mt-2 interactions">
                  <span [ngClass]="marketingAccess.edit?'':'d-none'" class="text-primary" (click)="editCard(card)">
                    <mat-icon svgIcon="edit"></mat-icon>
                  </span>
                  <!-- (click)="viewPdf(card.pdf)" -->
                  <button (click)="viewPdf(card.id)" class="view-pdf-btn">
                    View PPT
                  </button>
                  <button [ngClass]="marketingAccess.edit?'':'d-none'" (click)="DeleteModal(card.id)"
                    class="btn text-danger">
                    <mat-icon svgIcon="delete"></mat-icon>
                  </button>
                </div>
            </div>
          </div>
          }@else{
          <div [ngClass]="marketingAccess.view==false? '':'d-none'">
            <div class="text-danger">You have not permission</div>
          </div>
          }
        </div>
      </div>
    </div>
