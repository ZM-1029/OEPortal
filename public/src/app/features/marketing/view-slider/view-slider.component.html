
<div style="position: fixed; inset: 0; background: #fff; z-index: 1000;">
    <button
      (click)="closeDialog()"
      style="position: absolute; top: 10px; right: 20px; font-size: 20px; z-index: 10;"
    >
    <mat-icon class="text-danger float-end pb-2"  svgIcon="cross"></mat-icon>
    </button>
  
    <!-- Loading Indicator -->
    <div *ngIf="loading" class="d-flex justify-content-center align-items-center h-100">
      <div class="text-center">
        <!-- <mat-spinner></mat-spinner> -->
        <app-loader></app-loader>
      </div>
    </div>
  
    <!-- PDF Viewer UI -->
    <div class="p-2" style="height: 100vh;" *ngIf="!loading">
      <div class="d-flex flex-column h-100 position-relative">
  
        <!-- Top Controls -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <div class="d-flex align-items-center">
            <mat-icon svgIcon="zoomOut" class="mx-2 cursor-pointer" (click)="zoomOut()"></mat-icon>
            <mat-icon svgIcon="zoomIn" class="mx-2 cursor-pointer" (click)="zoomIn()"></mat-icon>
            <span class="ms-3">Zoom: {{ (zoom * 100) | number:'1.0-0' }}%</span>
          </div>
          <!-- <button class="btn btn-outline-secondary btn-sm" (click)="downloadQuotationPdf()">
            Download PDF
          </button> -->
        </div>
  
        <!-- PDF + Vertical Slider -->
        <div class="d-flex flex-grow-1 overflow-hidden">
          
          <!-- Vertical Slider -->
          <div class="d-flex flex-column align-items-center me-3 px-2" style="width: 40px;">
            <input
              type="range"
              orient="vertical"
              min="1"
              [max]="totalPages"
              [(ngModel)]="page"
              class="form-range"
              style="writing-mode: bt-lr; transform: rotate(180deg); height: 100%;"
            />
            <div class="small text-center mt-1">{{ page }} / {{ totalPages }}</div>
          </div>

          <div class="flex-grow-1 position-relative overflow-hidden">
            <pdf-viewer
              [src]="pdfSrc"
              [page]="page"
              [render-text]="true"
              [original-size]="false"
              [fit-to-page]="true"
              [autoresize]="true"
              [show-borders]="false"
              [zoom]="zoom"
              [show-all]="false"
              style="width: 100%; height: 100%;"
              (after-load-complete)="onPdfLoad($event)">
            </pdf-viewer>
  
            <!-- Watermark on Page 1 -->
         
  
        </div>
      </div>
    </div>
  </div>
  


  <div class="pdf-viewer-overlay">
    <div class="pdf-viewer-container">
      <!-- Close Button (Top Right) -->
      <button class="close-btn" (click)="closeDialog()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M18 6L6 18M6 6l12 12" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
  
      <!-- Loading Indicator -->
      <div *ngIf="loading" class="loading-indicator">
        <div class="spinner"></div>
        <p>Loading PDF...</p>
      </div>
  
      <!-- PDF Content -->
      <div *ngIf="!loading" class="pdf-content">
        <!-- Header with Title and Download -->
        <div class="pdf-header pe-4 me-4">
          <h3 class="pdf-title">Contingent Workforce</h3>
          <button class="download-btn" (click)="downloadPdf()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </button>
          <button class="download-btn" (click)="viewFullScreen()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            view full screen
          </button>
        </div>
  
        <!-- PDF Navigation Controls -->
        <!-- <div class="pdf-controls">
          <button class="nav-btn" (click)="zoomOut()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </button>
          
          <span class="zoom-level">{{ (zoom * 100) | number:'1.0-0' }}%</span>
          
          <button class="nav-btn" (click)="zoomIn()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="16"></line>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </button>
        </div> -->
  
        <!-- PDF Pages with Navigation -->
        <div class="pdf-pages-container">
          <button class="page-nav left" (click)="previousPage()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>
  
          <div class="pdf-pages">
            <pdf-viewer
              [src]="pdfSrc"
              [page]="page"
              [render-text]="true"
              [original-size]="false"
              [fit-to-page]="true"
              [autoresize]="true"
              [show-borders]="false"
              [zoom]="zoom"
              [show-all]="false"
              (after-load-complete)="onPdfLoad($event)">
            </pdf-viewer>
          </div>
  
          <button class="page-nav right" (click)="nextPage()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M9 18l6-6-6-6"></path>
            </svg>
          </button>
        </div>
  
        <!-- Page Indicator -->
        <div class="page-indicator">
          <span>{{ page }} / {{ totalPages }}</span>
        </div>
  
        <!-- Watermark -->
        <div class="pdf-watermark ">Z <span class="text-info">O</span> uma...</div>
      </div>
    </div>
  </div>
